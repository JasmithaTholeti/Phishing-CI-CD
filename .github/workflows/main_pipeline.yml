name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./phishing-backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

  train-and-build:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./phishing-backend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install httpx gdown

    - name: Download phishing dataset (Google Drive)
      run: |
        mkdir -p data
        gdown 1q96HI25w564BpVhJQyWF3IH-WUwdjSws -O data/phishing_email.csv

    - name: Train hybrid phishing model
      run: python train-hybrid.py

    - name: Upload model artifacts
      uses: actions/upload-artifact@v4
      with:
        name: model-artifacts
        path: |
          phishing-backend/phishing_model.joblib
          phishing-backend/model_columns.joblib
          phishing-backend/email_scaler.joblib

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker image
      run: |
        cd ..
        # 🔥 FIX: Hardcoded 'jasmithat' to prevent variable mismatch errors
        docker build -t jasmithat/phishing-backend:latest ./phishing-backend
        docker push jasmithat/phishing-backend:latest