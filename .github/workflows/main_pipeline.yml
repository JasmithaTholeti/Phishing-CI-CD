name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./phishing-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

  train-and-build:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./phishing-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx gdown ucimlrepo
          
      - name: Download phishing email dataset (Google Drive)
        run: |
          mkdir -p data
          gdown 1q96HI25w564BpVhJQyWF3IH-WUwdjSws -O data/phishing_email.csv
          
      - name: Train email phishing model
        run: python train_emails.py
        
      - name: Train website phishing model
        run: python train_websites.py
        
      - name: Verify model files exist
        run: |
          ls -lh *.joblib
          echo "✓ All model files generated successfully"
          
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            phishing-backend/*.joblib
            
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and Push Docker image
        run: |
          cd ..
          # Replace 'your-docker-username' with your actual Docker Hub ID
          docker build -t your-docker-username/phishing-backend:latest ./phishing-backend
          docker push your-docker-username/phishing-backend:latest
